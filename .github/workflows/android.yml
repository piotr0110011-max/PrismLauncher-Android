name: Android Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Qt 6 for Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Install Build Dependencies & ECM
        run: |
          sudo apt-get update && sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            extra-cmake-modules \
            libcmark-dev \
            libarchive-dev \
            libqrencode-dev

      - name: Configure CMake
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DLauncher_BUILD_PLATFORM="android" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DECM_DIR=/usr/share/ECM/cmake \
            -DENABLE_LTO=OFF

      - name: Build Prism Launcher
        run: cmake --build build --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Android
          path: build/**/*.apk
